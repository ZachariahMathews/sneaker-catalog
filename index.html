<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneaker Catalog — Curated Footwear Archive</title>
    <meta name="description" content="A curated minimal catalog featuring authentic footwear from Adidas, On Running, and Nike." />
    <meta property="og:title" content="Sneaker Catalog — Curated Footwear Archive" />
    <meta property="og:description" content="A curated minimal catalog featuring authentic footwear from Adidas, On Running, and Nike." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="catalog-wrapper">
      <!-- Site Header -->
      <header class="site-header">
        <div>
          <div class="brand-meta">
            <span class="status-dot"></span>
            <span>Archive Edition 2026.1 &bull; Curated Selection</span>
          </div>
          <h1 class="site-title">Sneaker Catalog</h1>
        </div>

        <div class="header-meta-right">
          <span>Official Catalog Links</span>
          <span>&bull;</span>
          <span>10 Models</span>
        </div>
      </header>

      <!-- Brand Navigation Filter Tabs -->
      <nav class="brand-nav-bar" id="brand-tabs" aria-label="Brand categories"></nav>

      <!-- Controls Bar: Search & View Switcher -->
      <section class="controls-toolbar" aria-label="Catalog controls">
        <div class="search-box">
          <svg class="icon-svg search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search by model, colorway, or SKU..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="toolbar-actions">
          <span class="item-count-label" id="item-count-display">10 of 10 models</span>

          <div class="view-toggle-group">
            <button type="button" id="view-grid-btn" class="view-toggle-btn active" title="Grid view">
              <svg class="icon-svg" viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
            </button>
            <button type="button" id="view-list-btn" class="view-toggle-btn" title="List view">
              <svg class="icon-svg" viewBox="0 0 24 24">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Main Catalog Display Area -->
      <main class="catalog-main" id="catalog-container"></main>

      <!-- Architectural Site Footer -->
      <footer class="site-footer">
        <div class="footer-left">
          <span>Ref: SNEAKER-ARCHIVE-VANILLA</span>
          <span>&bull;</span>
          <span>Deployable to GitHub Pages</span>
          <span>&bull;</span>
          <span>Pure Static HTML/CSS/JS</span>
        </div>
        <div class="footer-right">
          <span id="live-timestamp">2026 — ARCHIVE ACTIVE</span>
        </div>
      </footer>
    </div>

    <!-- Lightbox Modal Component -->
    <div id="image-modal" class="modal-overlay" role="dialog" aria-modal="true">
      <div class="modal-dialog">
        <div class="modal-header">
          <div>
            <h2 id="modal-title" class="modal-header-title">Sneaker Preview</h2>
            <div id="modal-meta" class="modal-header-meta">Brand Meta</div>
          </div>
          <button type="button" id="modal-close-btn" class="modal-close-btn" title="Close (Esc)">
            <svg class="icon-svg" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="modal-body">
          <button type="button" id="modal-prev-btn" class="modal-nav-btn modal-nav-prev" title="Previous (Left Arrow)">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <img id="modal-img" src="" alt="Sneaker product photo" />

          <button type="button" id="modal-next-btn" class="modal-nav-btn modal-nav-next" title="Next (Right Arrow)">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="modal-footer">
          <div id="modal-specs" class="modal-footer-specs">SPEC: ...</div>

          <div style="display: flex; align-items: center; gap: 1.25rem;">
            <button type="button" id="modal-share-btn" class="btn-share">
              <svg class="icon-svg" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Share Link</span>
            </button>

            <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer" class="link-catalog">
              <span>Open Catalog</span>
              <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Vanilla JS Script -->
    <script src="./app.js"></script>
  </body>
</html>
